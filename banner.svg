<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Shaurya Bansal - Full Stack Developer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4D6D">
        <animate attributeName="stop-color" values="#FF4D6D;#C77DFF;#4CC9F0;#FF4D6D" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#C77DFF">
        <animate attributeName="stop-color" values="#C77DFF;#4CC9F0;#FF4D6D;#C77DFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4CC9F0">
        <animate attributeName="stop-color" values="#4CC9F0;#FF4D6D;#C77DFF;#4CC9F0" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF4D6D"/>
      <stop offset="65%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#8B949E" stroke-width="0.5" opacity="0.10"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="280" rx="18"/>
    </clipPath>

    <clipPath id="type1"><rect x="62" y="160" height="30" width="0">
      <animate attributeName="width"
        values="0;240;240;0;0;0;0;0;0;0"
        keyTimes="0;0.095;0.262;0.333;0.4286;0.595;0.667;0.762;0.929;1"
        dur="21s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="62" y="160" height="30" width="0">
      <animate attributeName="width"
        values="0;0;0;0;228;228;0;0;0;0"
        keyTimes="0;0.095;0.262;0.333;0.4286;0.595;0.667;0.762;0.929;1"
        dur="21s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="62" y="160" height="30" width="0">
      <animate attributeName="width"
        values="0;0;0;0;0;0;0;324;324;0"
        keyTimes="0;0.095;0.262;0.333;0.4286;0.595;0.667;0.762;0.929;1"
        dur="21s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="#0B0F17"/>

    <g>
      <circle cx="180" cy="90" r="230" fill="url(#blobA)">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 90,40; -40,60; 0,0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="220" r="260" fill="url(#blobB)">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; -80,-50; 60,-20; 0,0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="70" r="200" fill="url(#blobC)">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; -50,70; 30,-40; 0,0" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <rect x="-40" y="-40" width="1080" height="360" fill="url(#grid)"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 40,40; 0,0" dur="12s" repeatCount="indefinite"/>
    </g>

    <g opacity="0.9">
      <circle cx="40" cy="34" r="6" fill="#FF5F56">
        <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="62" cy="34" r="6" fill="#FFBD2E">
        <animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="84" cy="34" r="6" fill="#27C93F">
        <animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(855,140)">
      <circle r="72" fill="none" stroke="#C77DFF" stroke-width="1" opacity="0.35"/>
      <circle r="48" fill="none" stroke="#4CC9F0" stroke-width="1" opacity="0.3"/>
      <g>
        <circle cx="72" cy="0" r="4.5" fill="#FF4D6D"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="48" cy="0" r="3.5" fill="#4CC9F0"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="72" r="3" fill="#C77DFF"/>
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="13s" repeatCount="indefinite"/>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="60" y="98" font-size="15" fill="#8B949E" letter-spacing="3">
        <tspan fill="#4CC9F0">~/</tspan>whoami
      </text>

      <text x="58" y="146" font-size="52" font-weight="700" letter-spacing="1.5" fill="url(#nameGrad)">SHAURYA BANSAL</text>
      <text x="58" y="146" font-size="52" font-weight="700" letter-spacing="1.5" fill="url(#shine)">
        SHAURYA BANSAL
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.42;0.5;0.58;1" dur="7s" repeatCount="indefinite"/>
      </text>

      <g font-size="20" fill="#C9D1D9">
        <text x="62" y="182" clip-path="url(#type1)">Full Stack Developer</text>
        <text x="62" y="182" clip-path="url(#type2)">Building CareerLens</text>
        <text x="62" y="182" clip-path="url(#type3)">AI Tools + Scalable Systems</text>
      </g>

      <rect y="166" width="11" height="20" fill="#FF4D6D">
        <animate attributeName="x"
          values="62;302;302;62;290;290;62;386;386;62"
          keyTimes="0;0.095;0.262;0.333;0.4286;0.595;0.667;0.762;0.929;1"
          dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M60 214 L940 214" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round"
      stroke-dasharray="880" stroke-dashoffset="880">
      <animate attributeName="stroke-dashoffset" values="880;0;0;880" keyTimes="0;0.35;0.85;1" dur="10s" repeatCount="indefinite"/>
    </path>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681" letter-spacing="2">
      <text x="60" y="244">TYPESCRIPT · REACT · NODE · PYTHON · AWS · MONGO</text>
    </g>

    <g fill="#C77DFF">
      <circle cx="150" cy="250" r="2">
        <animate attributeName="cy" values="270;20" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="250" r="1.6" fill="#4CC9F0">
        <animate attributeName="cy" values="290;10" dur="12s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="250" r="2.2" fill="#FF4D6D">
        <animate attributeName="cy" values="280;15" dur="11s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.75;0" dur="11s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="250" r="1.8">
        <animate attributeName="cy" values="275;25" dur="10s" begin="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#30363D" stroke-width="1"/>
  </g>
</svg>
